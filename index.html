<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domino board test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap">
<style>
:root{--fg:#000;--bg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#fff;--bg:#000}}
:root[data-theme="dark"]{--fg:#fff;--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.3 Archivo,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.bar>*{pointer-events:auto}
#hint{font-weight:700}
#info{font-size:13px;opacity:.65}
button{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--fg);border-radius:0;padding:0 18px;min-height:44px;cursor:pointer}
button:active,button.solid{background:var(--fg);color:var(--bg)}
.z{display:flex;gap:6px}.z button{padding:0;min-width:44px}
#actions{position:absolute;left:0;right:0;bottom:68px;display:none;justify-content:center;gap:10px}
#actions.on{display:flex}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;display:none}
#tray{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;padding:10px 12px 12px;border-top:2px solid var(--fg)}
#tray.lock{opacity:.3;pointer-events:none}
.slot{width:64px;height:64px;display:grid;place-items:center;touch-action:none;cursor:grab}
.d{display:flex;width:64px;height:32px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);box-sizing:border-box;transition:transform .18s}
.sel .d{background:var(--fg);color:var(--bg)}
.h{width:50%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:3px;box-sizing:border-box}
.h+.h{border-left:2px solid currentColor}
.h i{width:5px;height:5px;border-radius:50%;background:currentColor;place-self:center}
#ghost{position:fixed;pointer-events:none;display:none;z-index:9;transform:translate(-50%,-50%)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
@keyframes in{from{transform:translateX(-140px);opacity:0}}
.d{position:relative}
.slot.in{animation:in .3s ease-out}
.play .d::after{content:'';position:absolute;inset:-7px;padding:2px;pointer-events:none;background:conic-gradient(from var(--a),var(--fg) 0 30%,transparent 30% 50%,var(--fg) 50% 80%,transparent 80%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 2.4s linear infinite}
#reset{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none}
#pv{position:absolute;left:12px;top:62px;width:220px;max-width:calc(100% - 24px);box-sizing:border-box;padding:12px;border:2px solid var(--fg);background:var(--bg);display:none;flex-direction:column;gap:6px;pointer-events:none}
#pv.on{display:flex}
#pv b{font-size:17px}
#pv div+b{margin-top:2px}
#pv small{opacity:.65}
#pv .d{width:96px;height:48px}
#pv .h i{width:7px;height:7px}
#reset.on{display:block}
#over{background:color-mix(in srgb,var(--bg) 75%,transparent)}
#over>div{border:2px solid var(--fg);background:var(--bg);padding:18px 22px;max-height:92%;overflow:auto}
#over table{border-collapse:collapse;margin:0 auto 16px;text-align:left}
#over tr{border-bottom:1px solid color-mix(in srgb,var(--fg) 25%,transparent)}
#over td{padding:5px 0}
#over td+td{text-align:right;padding-left:28px;font-weight:700}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#energy{font-weight:700;font-size:22px;line-height:1}
#stats{position:absolute;left:12px;bottom:12px;font-size:13px;line-height:1.5}
#end{position:absolute;right:12px;bottom:12px;background:var(--fg);color:var(--bg)}
#end:disabled{opacity:.3}
#end.flash{animation:fl .7s steps(1) infinite}
@keyframes fl{50%{background:var(--bg);color:var(--fg)}}
#over{position:absolute;inset:0;display:none;place-items:center;background:var(--bg);text-align:center}
#over.on{display:grid}
#over h2{font-size:28px;margin:0 0 10px}
</style></head><body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="bar">
    <div><div id="hint"></div><div id="info"></div></div>
    <div class="r"><div id="energy"></div><div class="z"><button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button><button id="fit">Fit</button></div></div>
  </div>
  <div id="toast"></div>
  <div id="pv"></div>
  <div id="actions"><button id="cancel">Cancel</button><button id="ok" class="solid">OK</button></div>
  <div id="stats"></div>
  <button id="end">End turn</button>
  <button id="reset">Reset game</button>
  <div id="over"><div><h2 id="otitle">Game over</h2><p id="ostats"></p><button id="again" class="solid">New game</button></div></div>
</div>
<div id="tray"></div>
<div id="ghost"></div>
<script>
const TW=64,TH=32,N=20,T=9,LIFT=18,PLACED=5;
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d'),tray=$('#tray'),ghost=$('#ghost');
let hand=[],placed=[],occ=new Map(),sel=-1,pending=null,drag=null,pdrag=null,pan=null,st=null,energy=10,stat=newStat(),ended=0,uid=0,lastRot=0,lives=3,busy=0,playedTurn=0,flashT=-9e9,lastPlay=performance.now(),fresh=-1,reason='',swing=null;
const CH={p:{x:14,y:8},c:{x:3,y:9}},chr=new Map(),SW=480;for(const w in CH)for(let i=0;i<3;i++)for(let j=0;j<3;j++)chr.set((CH[w].x+i)+','+(CH[w].y+j),w);
const MAXE=10;
let W,H,dpr=1,S=1,px=0,py=0,fg='#000',bg='#fff',cl=0,ct=0,first=1,hw,hh,ox,oy;
function draw(n){for(let i=0;i<n;i++)hand.push({a:Math.random()*7|0,b:Math.random()*7|0,ang:0})}draw(6);
const rotOf=d=>((d.ang/90%4)+4)%4;
const dims=r=>r%2?[1,2]:[2,1];
const cells=m=>[[[m.x,m.y],[m.x+1,m.y]],[[m.x,m.y],[m.x,m.y+1]],[[m.x+1,m.y],[m.x,m.y]],[[m.x,m.y+1],[m.x,m.y]]][m.rot&3];
const clamp=m=>{const[w,h]=dims(m.rot);m.x=Math.max(0,Math.min(N-w,m.x));m.y=Math.max(0,Math.min(N-h,m.y))};
function check(m,free,who='p'){const cs=cells(m),pp=[m.a,m.b],t={};let cost=0,stem=0;
  for(let k=0;k<2;k++)if(occ.has(cs[k][0]+','+cs[k][1])||chr.has(cs[k][0]+','+cs[k][1]))return{ok:0,why:'Space taken'};
  for(let k=0;k<2;k++){const[x,y]=cs[k];let touch=0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const kk=(x+dx)+','+(y+dy),cc=chr.get(kk);if(cc){if(cc===who)stem=1;continue}const n=occ.get(kk);if(!n)continue;if(n.o===who)stem=1;
      if(n.pip!==pp[k])return{ok:0,why:'Pips must match'};
      touch=1;if((t[n.id]=(t[n.id]||0)+1)>1)return{ok:0,why:'Touches same domino twice'}}
    if(!touch)cost+=pp[k]}
  if(!stem)return{ok:0,why:'Connect to your character'};return cost>energy&&!free?{ok:0,why:'Needs '+cost+' energy',cost}:{ok:1,cost}}
const valid=m=>check(m).ok;
function label(m,ck){const[w,h]=dims(m.rot),t=ck.ok?'−'+ck.cost:ck.why,[X,Y]=P(m.x+w/2,m.y+h/2,cl+ct+8);
  cx.font='700 14px Archivo,system-ui,sans-serif';const tw=cx.measureText(t).width+14,bx=X-tw/2,by=Y-46;
  cx.fillStyle=ck.ok?bg:fg;cx.fillRect(bx,by,tw,24);cx.strokeStyle=fg;cx.lineWidth=2;cx.strokeRect(bx,by,tw,24);
  cx.fillStyle=ck.ok?fg:bg;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,X,by+12)}
const P=(gx,gy,z=0)=>[ox+(gx-gy)*hw,oy+(gx+gy)*hh-z*S];
const G=(X,Y)=>{const u=(X-ox)/hw,v=(Y-oy)/hh;return[(u+v)/2,(v-u)/2]};
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
  const f=getComputedStyle(document.documentElement);fg=f.getPropertyValue('--fg').trim()||'#000';bg=f.getPropertyValue('--bg').trim()||'#fff';
  if(first){fit();first=0}info()}
function fit(){S=Math.min((W-24)/(N*TW),(H-110)/(N*TH));px=py=0;info()}
function zoom(k){S=Math.max(.25,Math.min(3,S*k));px*=k;py*=k;info()}
function info(){$('#info').textContent=`Tile ${Math.round(TW*S)} × ${Math.round(TH*S)} px · ${N} × ${N}`}
new ResizeObserver(size).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',size);
$('#zi').onclick=()=>zoom(1.25);$('#zo').onclick=()=>zoom(.8);$('#fit').onclick=fit;

function poly(p,col,a,sw){cx.beginPath();p.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();
  if(col){cx.fillStyle=bg;cx.fill();cx.globalAlpha=a;cx.fillStyle=col;cx.fill();cx.globalAlpha=1}
  if(sw){cx.strokeStyle=fg;cx.lineWidth=sw;cx.stroke()}}
function hi(m,ok){const[w,h]=dims(m.rot),x=m.x,y=m.y;
  poly([P(x,y),P(x+w,y),P(x+w,y+h),P(x,y+h)],fg,ok?.25:.08,3);
  if(!ok){const a=P(x,y),b=P(x+w,y+h),c=P(x+w,y),d=P(x,y+h);cx.lineWidth=2;cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.moveTo(...c);cx.lineTo(...d);cx.stroke()}}
function dom(m,z,t,solid){const[w,h]=dims(m.rot),x=m.x,y=m.y,z1=z+t;
  poly([P(x,y+h,z1),P(x+w,y+h,z1),P(x+w,y+h,z),P(x,y+h,z)],fg,solid?.7:.12,1.5);
  poly([P(x+w,y,z1),P(x+w,y+h,z1),P(x+w,y+h,z),P(x+w,y,z)],fg,solid?.45:.28,1.5);
  poly([P(x,y,z1),P(x+w,y,z1),P(x+w,y+h,z1),P(x,y+h,z1)],solid?fg:m.cpu?fg:bg,solid?1:m.cpu?.2:1,1.5);
  const[X,Y]=P(x,y,z1);cx.save();cx.setTransform(dpr*hw,dpr*hh,-dpr*hw,dpr*hh,dpr*X,dpr*Y);
  if(m.cpu&&!solid){cx.save();cx.beginPath();cx.rect(0,0,w,h);cx.clip();cx.lineWidth=.03;cx.strokeStyle=fg;cx.globalAlpha=.5;cx.beginPath();for(let q=.25;q<w+h;q+=.25){cx.moveTo(q,0);cx.lineTo(0,q)}cx.stroke();cx.restore()}
  const c=solid?bg:fg;cx.fillStyle=c;cx.strokeStyle=c;cx.lineWidth=.05;
  cx.beginPath();if(w==2){cx.moveTo(1,.12);cx.lineTo(1,.88)}else{cx.moveTo(.12,1);cx.lineTo(.88,1)}cx.stroke();
  const cs=cells({x:0,y:0,rot:m.rot});
  [m.a,m.b].forEach((n,k)=>{const[a,b]=cs[k];PIPS[n].forEach(i=>{const qx=a+.27+(i%3)*.23,qy=b+.27+((i/3)|0)*.23;if(m.cpu&&!solid){cx.fillStyle=bg;cx.beginPath();cx.arc(qx,qy,.14,0,7);cx.fill();cx.fillStyle=c}cx.beginPath();cx.arc(qx,qy,.08,0,7);cx.fill()})});
  cx.restore()}

function frame(){requestAnimationFrame(frame);if(!W)return;
  hw=TW*S/2;hh=TH*S/2;ox=W/2+px;oy=H/2-N*hh+py+22;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  cx.globalAlpha=.2;cx.strokeStyle=fg;cx.lineWidth=1;cx.beginPath();
  for(let i=1;i<N;i++){cx.moveTo(...P(i,0));cx.lineTo(...P(i,N));cx.moveTo(...P(0,i));cx.lineTo(...P(N,i))}
  cx.stroke();cx.globalAlpha=1;
  poly([P(0,0),P(N,0),P(N,N),P(0,N)],null,1,2.5);
  drawChars();
  const live=drag&&drag.on,act=live?drag:pending;
  let ck;if(act){cl+=((live?LIFT:7)-cl)*.3;ct+=(T-ct)*.25;ck=check(act);hi(act,ck.ok)}
  
  depthSort(placed.concat([{ch:'c'},{ch:'p'}]))
    .forEach(m=>{if(m.ch)return drawChar(m.ch);const a=(performance.now()-(m.born||0))/380;dom(m,a<1?34*(1-a)*(1-a):0,PLACED,false)});
  if(act){dom(act,cl,ct,true);label(act,ck)}
  const fa=performance.now()-flashT;if(fa<1050&&((fa/175)|0)%2===0){cx.beginPath();[P(0,0),P(N,0),P(N,N),P(0,N)].forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.globalAlpha=.5;cx.fillStyle=fg;cx.fill();cx.globalAlpha=1}}
requestAnimationFrame(frame);

const half=n=>`<div class="h">${PIPS[n].map(i=>`<i style="grid-area:${(i/3|0)+1}/${i%3+1}"></i>`).join('')}</div>`;
const dhtml=d=>`<div class="d" style="transform:rotate(${d.ang}deg)">${half(d.a)}${half(d.b)}</div>`;
function render(){
  tray.innerHTML='';pc.clear();
  hand.forEach((d,i)=>{const s=document.createElement('div');s.className='slot'+(i===sel?' sel':'')+(!busy&&!pending&&!ended&&canPlay(d)?' play':'')+(i===fresh?' in':'');
    if((pending&&pending.i===i)||(drag&&drag.i===i))s.style.visibility='hidden';
    s.innerHTML=dhtml(d);s.onpointerdown=e=>{e.preventDefault();if(st||drag||ended||busy)return;st={i,x:e.clientX,y:e.clientY,el:s,pid:e.pointerId}};tray.append(s)});
  tray.classList.toggle('lock',!!pending||ended||busy);$('#actions').classList.toggle('on',!!pending);
  $('#hint').textContent=busy?'Computer turn':pending?'Tap the domino or press OK to place it':drag?'Right-click or tap with a second finger to rotate':sel>=0?'Tap to rotate. Drag onto the board.':'Select a domino';hud()}
function select(i){sel=i;render()}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',1400)}

function moveDrag(e){const[X,Y]=pt(e),d=drag;d.e=e;d.on=X>=0&&X<=W&&Y>=0&&Y<=H;
  if(d.on){const[fx,fy]=G(X,Y-48),[w,h]=dims(d.rot);d.x=Math.round(fx-w/2);d.y=Math.round(fy-h/2);clamp(d)}
  ghost.style.display=d.on?'none':'block';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}
addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.pid)return;if(drag&&(e.buttons&2)&&!(drag.pb&2))rotDrag();if(drag)drag.pb=e.buttons;
  if(st&&!drag&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){
    const d=hand[st.i];drag={i:st.i,x:0,y:0,rot:rotOf(d),a:d.a,b:d.b,on:0};ct=0;cl=0;sel=st.i;render();
    ghost.innerHTML=`<div class="slot sel">${dhtml(d)}</div>`}
  if(drag)moveDrag(e)});
addEventListener('pointerup',e=>{if(!st||e.pointerId!==st.pid)return;const s=st;st=null;
  if(drag){const d=drag;drag=null;ghost.style.display='none';
    const ck=d.on&&check(d);if(d.on&&ck.ok){pending={x:d.x,y:d.y,rot:d.rot,i:d.i,a:d.a,b:d.b}}else if(d.on)toast(ck.why);
    render();return}
  if(sel===s.i){const d=hand[s.i];d.ang+=90;s.el.firstChild.style.transform=`rotate(${d.ang}deg)`}else select(s.i)});
addEventListener('pointercancel',()=>{st=null;drag=null;ghost.style.display='none';render()});
function rotDrag(){const n=performance.now();if(!drag||n-lastRot<150)return;lastRot=n;drag.rot=(drag.rot+1)&3;hand[drag.i].ang+=90;
  const d=ghost.querySelector('.d');if(d)d.style.transform=`rotate(${hand[drag.i].ang}deg)`;if(drag.e)moveDrag(drag.e)}
addEventListener('pointerdown',e=>{if(drag&&st&&(e.button===2||e.pointerId!==st.pid))rotDrag()});
addEventListener('mousedown',e=>{if(e.button!==2)return;if(drag)rotDrag();});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){if(drag)rotDrag()}});

function hit(m,X,Y){const[w,h]=dims(m.rot);return[0,cl+ct].some(z=>{const[a,b]=G(X,Y+z*S);return a>=m.x&&a<m.x+w&&b>=m.y&&b<m.y+h})}
cv.onpointerdown=e=>{const[X,Y]=pt(e);cv.setPointerCapture(e.pointerId);
  if(pending&&hit(pending,X,Y)){const[fx,fy]=G(X,Y);pdrag={X,Y,fx,fy,x:pending.x,y:pending.y,moved:0}}else pan={X,Y,px,py}};
cv.onpointermove=e=>{const[X,Y]=pt(e);
  if(pdrag){if(Math.hypot(X-pdrag.X,Y-pdrag.Y)>8)pdrag.moved=1;
    if(pdrag.moved){const[fx,fy]=G(X,Y);pending.x=Math.round(pdrag.x+fx-pdrag.fx);pending.y=Math.round(pdrag.y+fy-pdrag.fy);clamp(pending)}}
  else if(pan){px=pan.px+X-pan.X;py=pan.py+Y-pan.Y}};
cv.onpointerup=cv.onpointercancel=()=>{if(pdrag&&!pdrag.moved)commit();pdrag=pan=null};

function commit(){const m=pending;if(!m)return;const ck=check(m);if(!ck.ok)return toast(ck.why);
  placed.push({x:m.x,y:m.y,rot:m.rot,a:m.a,b:m.b});const id=++uid;cells(m).forEach(([a,b],k)=>occ.set(a+','+b,{id,o:'p',pip:k?m.b:m.a}));energy-=ck.cost;stat.played++;stat.spent+=ck.cost;stat.pips+=m.a+m.b;if(m.a===m.b)stat.doubles++;if(!ck.cost)stat.free++;stat.maxCost=Math.max(stat.maxCost,ck.cost);playedTurn=1;swing={who:'p',t0:performance.now()};lastPlay=performance.now();
  hand.splice(m.i,1);pending=null;sel=-1;render()}
$('#ok').onclick=commit;
$('#cancel').onclick=()=>{pending=null;render()};
const pc=new Map(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fc=document.createElement('canvas'),fx=fc.getContext('2d');
function fig(c,w,p){const me=w==='p',dir=me?1:-1;
  c.lineWidth=.04;c.lineJoin=c.lineCap='round';c.strokeStyle=fg;c.fillStyle=bg;
  const cp=CH.p,ce=CH.c,vx=((ce.x-ce.y)-(cp.x-cp.y))*TW/2,vy=((ce.x+ce.y)-(cp.x+cp.y))*TH/2,tg=Math.atan2(vy,vx)*180/Math.PI+(me?0:180),kk=me?1:-1;let A=35;if(p>=0)A=p<.25?35+25*p/.25:p<.5?60-70*(p-.25)/.25:-10+45*(p-.5)/.5;
  const ang=(tg+kk*A)*Math.PI/180,sl=p>=.25&&p<.6?.12:0,lx=Math.cos(tg*Math.PI/180)*sl,ly=Math.sin(tg*Math.PI/180)*sl,hx=me?.3:-.3;
  c.save();c.translate(lx,ly);
  const ell=(x,y,rx,ry,r=0)=>{c.beginPath();c.ellipse(x,y,rx,ry,r,0,7);c.fill();c.stroke()};
  if(me){ell(-.2,-1.2,.1,.3,-.15);ell(.2,-1.2,.1,.3,.15)}
  else{c.beginPath();c.moveTo(-.1,-.95);c.quadraticCurveTo(-.7,-1.2,-1.2,-1.02);c.quadraticCurveTo(-.65,-.82,-.3,-.62);c.closePath();c.fill();c.stroke()}
  ell(-.17,-.02,.15,.07);ell(.17,-.02,.15,.07);ell(0,-.5,.4,.5);
  if(me)ell(0,-.18,.09,.09);else{c.fillStyle=fg;ell(-.14,-.78,.05,.085);ell(.14,-.78,.05,.085);c.fillStyle=bg}
  c.save();c.translate(hx,-.42);c.rotate(ang);
  c.beginPath();c.moveTo(.05,-.045);c.lineTo(.95,-.045);c.lineTo(1.1,0);c.lineTo(.95,.045);c.lineTo(.05,.045);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(.03,-.12);c.lineTo(.03,.12);c.stroke();
  ell(0,0,.09,.09);ell(-.16,0,.09,.09);c.restore();c.restore()}
function drawChars(){const now=performance.now(),k=TW*S*1.25,Wc=3.6*k,Hc=3*k,faded=sel>=0||!!pending||!!drag;
  const cw=Math.ceil(Wc*dpr),ch=Math.ceil(Hc*dpr);if(fc.width!==cw||fc.height!==ch){fc.width=cw;fc.height=ch}
  for(const w of['c','p']){const o=CH[w];poly([P(o.x,o.y),P(o.x+3,o.y),P(o.x+3,o.y+3),P(o.x,o.y+3)],fg,.1,2)}}
function drawChar(w){const now=performance.now(),k=TW*S*1.25,Wc=3.6*k,Hc=3*k,faded=sel>=0||!!pending||!!drag,o=CH[w],cw=fc.width,ch=fc.height;
    let p=-1;if(swing&&swing.who===w){p=(now-swing.t0)/SW;if(p>1)p=-1}
    const a=Math.max(faded?.2:1,p>=0?Math.sin(Math.PI*p)*.65:0);
    fx.setTransform(1,0,0,1,0,0);fx.clearRect(0,0,cw,ch);fx.setTransform(dpr*k,0,0,dpr*k,cw/2,ch*.75);fig(fx,w,p);
    const[X,Y]=P(o.x+1.5,o.y+1.5);cx.globalAlpha=a;cx.drawImage(fc,X-Wc/2,Y-Hc*.75,Wc,Hc);cx.globalAlpha=1}
const COMBOS=[];for(let s=0;s<=12;s++)for(let lo=0;lo<=6;lo++){const hi=s-lo;if(hi>=lo&&hi<=6)COMBOS.push([lo,hi])}
const NAMES=['Fumble','Pinprick','Quick Nip','Paired Poke','Shadow Tap','Sidestep','Hollow Jab','Pocket Sand','Twin Flick','Moth Wing','Rabbit Punch','Needle Rain','Void Whisper','Thorn Snap','Lantern Slash','Double Trouble','Dusk Lunge','Iron Burrow','Comet Tail','Hexed Reel','Briar Storm','Quad Quake','Moonfall','Ember Crown','Wolfsbane','Fivefold Fury','Eclipse Fang','Twelve Moons'];
function skill(a,b){const lo=Math.min(a,b),hi=Math.max(a,b),s=lo+hi,name=NAMES[COMBOS.findIndex(c=>c[0]===lo&&c[1]===hi)];
  const n=s<=3?1:s<=7?2:3,f=[1,1,.7,.6][n],dbl=lo===hi&&s>0?1.25:1,K=['dmg','blk','buf','deb'],st=(lo*3+hi)%4;
  const base={dmg:s*1.5+1,blk:s*1.3+1,buf:1+Math.floor(s/4),deb:1+Math.floor(s/3)},BN=['Strength','Thorns','Regen','Haste'][s%4],DN=['Weak','Vulnerable','Poison','Slow'][(s+1)%4],parts=[];
  for(let i=0;i<n;i++){const k=K[(st+i)%4],v=Math.max(1,Math.round(base[k]*f*dbl));parts.push(k==='dmg'?`Deal ${v} damage`:k==='blk'?`Gain ${v} block`:k==='buf'?`Gain ${v} ${BN}`:`Apply ${v} ${DN}`)}
  return{name,desc:parts.join('. ')+'.',power:s,dbl:dbl>1}}
function pv(){const d=hand[sel],e=$('#pv'),on=sel>=0&&!!d&&!ended;e.classList.toggle('on',on);if(!on)return;
  const f=skill(d.a,d.b);e.innerHTML=`<div class="sel"><div class="d" style="transition:none">${half(d.a)}${half(d.b)}</div></div><b>${f.name}</b><div>${f.desc}</div><small>Power ${f.power}${f.dbl?', double bonus +25%':''}</small>`}
function rect(m){if(m.ch){const o=CH[m.ch];return[o.x,o.x+3,o.y,o.y+3]}const[w,h]=dims(m.rot);return[m.x,m.x+w,m.y,m.y+h]}
function depthSort(a){const r=a.map(rect),n=a.length,out=[],vis=[];
  const behind=(i,j)=>r[i][1]<=r[j][0]||r[i][3]<=r[j][2];
  const v=j=>{if(vis[j])return;vis[j]=1;for(let i=0;i<n;i++)if(i!==j&&behind(i,j)&&!behind(j,i))v(i);out.push(a[j])};
  for(let j=0;j<n;j++)v(j);return out}
function newStat(){return{played:0,wasted:0,turn:1,spent:0,pips:0,doubles:0,free:0,maxCost:0,cpu:0,lost:0,t0:performance.now()}}
function rs(){$('#reset').classList.toggle('on',!ended&&!busy&&performance.now()-lastPlay>1e4)}
setInterval(rs,500);
function canPlay(d){const k=d.a+','+d.b;if(!pc.has(k)){let ok=0;for(let r=0;r<4&&!ok;r++){const[w,h]=dims(r);for(let x=0;x<=N-w&&!ok;x++)for(let y=0;y<=N-h&&!ok;y++)ok=check({x,y,rot:r,a:d.a,b:d.b}).ok}pc.set(k,!!ok)}return pc.get(k)}
function cpuPlay(){const rare=Math.random()<.12,own=placed.some(m=>m.cpu);
  for(let n=0;n<500;n++){const m={x:Math.random()*N|0,y:Math.random()*N|0,rot:Math.random()*4|0,cpu:1};clamp(m);
    const cs=cells(m),req=[null,null];let touch=0,bad=0,stem=0;
    cs.forEach(([x,y],k)=>{for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const kk=(x+dx)+','+(y+dy),cc=chr.get(kk);if(cc){if(cc==='c')stem=1;continue}const o=occ.get(kk);if(o){touch=1;if(o.o==='c')stem=1;if(req[k]!==null&&req[k]!==o.pip)bad=1;req[k]=o.pip}}});
    const need=own&&!rare;if(bad||!stem||(need&&!touch)||(rare&&touch))continue;
    m.a=req[0]??(Math.random()*7|0);m.b=req[1]??(Math.random()*7|0);
    if(!check(m,1,'c').ok)continue;
    const id=++uid;cs.forEach(([x,y],k)=>occ.set(x+','+y,{id,o:'c',pip:k?m.b:m.a}));placed.push({...m,born:performance.now()});stat.cpu++;swing={who:'c',t0:performance.now()};return 1}
  return 0}
async function endTurn(){if(pending||ended||busy)return;busy=1;sel=-1;stat.wasted+=energy;energy=0;render();
  if(!playedTurn){lives--;stat.lost++;flashT=performance.now();render();await sleep(1100);if(lives<=0)return finish('You ran out of lives')}
  const n=2+(Math.random()*5|0);
  for(let i=0;i<n;i++){await sleep(450);cpuPlay();hud()}
  await sleep(450);stat.turn++;energy=MAXE;playedTurn=0;render();
  for(let i=0;i<4;i++){hand.push({a:Math.random()*7|0,b:Math.random()*7|0,ang:0});fresh=hand.length-1;render();await sleep(380)}
  fresh=-1;busy=0;lastPlay=performance.now();
  if(hand.length>=12)return finish('Your hand reached 12 dominoes');render()}
function finish(r){reason=r;ended=1;busy=0;render()}
function newGame(){hand=[];placed=[];occ=new Map();energy=MAXE;stat=newStat();lives=3;ended=0;busy=0;playedTurn=0;sel=-1;pending=null;fresh=-1;swing=null;draw(6);lastPlay=performance.now();render()}
function modal(){const s=stat,bp=placed.reduce((t,m)=>t+m.a+m.b,0),hp=hand.reduce((t,d)=>t+d.a+d.b,0),sec=Math.round((performance.now()-s.t0)/1000);
  const rows=[['Result',reason],['Turns',s.turn],['Time',Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')],['Lives lost',s.lost],['Your dominoes',s.played],['Computer dominoes',s.cpu],['Pips you played',s.pips],['Pips left in hand',hp],['Pips on board',bp],['Energy spent',s.spent],['Energy wasted',s.wasted],['Energy efficiency',Math.round(100*s.spent/Math.max(1,s.spent+s.wasted))+'%'],['Free plays',s.free],['Doubles played',s.doubles],['Costliest play',s.maxCost],['Board covered',Math.round(placed.length/2)+'%']];
  $('#ostats').innerHTML='<table>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+'</table>'}
function hud(){$('#energy').innerHTML='Energy '+energy+'<br><span style="font-weight:400;font-size:16px">Lives '+'●'.repeat(Math.max(0,lives))+'○'.repeat(3-Math.max(0,lives))+'</span>';
  $('#stats').innerHTML=`Played ${stat.played}<br>Energy wasted ${stat.wasted}<br>Turn ${stat.turn}`;
  $('#end').disabled=!!pending||!!ended||!!busy;$('#end').classList.toggle('flash',!busy&&!ended&&!pending&&hand.every(d=>!canPlay(d)));rs();pv();$('#over').classList.toggle('on',!!ended);
  if(ended)modal()}
$('#end').onclick=endTurn;
$('#again').onclick=$('#reset').onclick=newGame;

render();
</script></body></html>
