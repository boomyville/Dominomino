<style>

#over{position:absolute;inset:0;display:none;place-items:center;background:var(--bg);text-align:center}
#over.on{display:grid}
#over h2{font-size:28px;margin:0 0 10px}
#pv{gap:3px}

html,body{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){html,body{height:100dvh}}

      if(!deckDraw.length)toast('Your stack is empty');
      else{const pool=deckDraw.map((x,i)=>({x,i})).sort((p,q)=>TY[p.x.t].n.localeCompare(TY[q.x.t].n));
        const c=await pick('Find a domino','Choose a domino from your stack to add to your hand.',pool.map(p=>p.x));
        const got=deckDraw.splice(pool[c].i,1)[0];got.ang=0;hand.push(got);fresh=hand.length-1;render();await sleep(300);fresh=-1}}
    else if(e.k==='power'){pl.pow+=v;fl('p','Power +'+v)}
    else if(e.k==='boost'){pl.boost+=v;fl('p','Boost +'+v)}
    else if(e.k==='heal'){const h=Math.min(v,pl.max-pl.hp);pl.hp+=h;stat.healed+=h;fl('p','+'+h+' HP')}
    else if(e.k==='rerollA'){hand.forEach(h=>{h.a=rpip();h.b=rpip()});stat.rerolls+=hand.length;fl('p','Rerolled hand')}
    else if(e.k==='rerollP'&&hand.length){const c=await pick('Reroll a domino','Choose a domino from your hand to reroll.',hand);hand[c].a=rpip();hand[c].b=rpip();stat.rerolls++}
    else if(e.k==='fury'){pl.fury+=v;fl('p',stx(pl)||'Fury 0')}
    else if(e.k==='impS'){pl.fury-=v;fl('p',stx(pl)||'Fury 0')}
    else if(e.k==='impE'){foe.fury-=v;fl('c',stx(foe)||'Fury 0')}
    else if(e.k==='selfdmg'){pl.hp=Math.max(0,pl.hp-v);stat.selfdmg+=v;bat.hpLost=1;fl('p','-'+v+' HP')}
    else if(e.k==='gen'){for(let i=0;i<v;i++)deckDraw.splice(Math.random()*(deckDraw.length+1)|0,0,newDomino());fl('p','+'+v+' in stack')}
    else if(e.k==='life'){lives+=v;fl('p','+'+v+' lives')}
    render();await sleep(160)}
  if(atk)tick(pl)}

/* ---- character tags (HP, shield, status, intent) and floating numbers ---- */
function tag(X,Y,lines){cx.font='700 12px Archivo,system-ui,sans-serif';const lh=15,w=Math.max(...lines.map(l=>cx.measureText(l).width))+16,h=lines.length*lh+8,x=Math.max(4,Math.min(W-w-4,Math.round(X-w/2))),y=Math.max(4,Math.round(Y-h));
  cx.fillStyle=bg;cx.fillRect(x,y,w,h);cx.strokeStyle=fg;cx.lineWidth=2;cx.strokeRect(x,y,w,h);cx.fillStyle=fg;cx.textAlign='center';cx.textBaseline='middle';
  lines.forEach((l,i)=>cx.fillText(l,x+w/2,y+4+lh*i+lh/2))}
function drawLabels(){const now=performance.now(),k=TW*S*1.25;
  for(const w of['c','p']){const o=CH[w],[X,Y]=P(o.x+1.5,o.y+1.5),top=Y-1.7*k-8;
    if(w==='c')tag(X,top,[foe.name.toUpperCase()+'  LV '+foe.lv+'  HP '+foe.hp+'/'+foe.max,['Shield '+foe.sh,stx(foe)].filter(Boolean).join('   '),...foe.intent.map(i=>'> '+itx(i))]);
    else tag(X,top,['YOU  HP '+pl.hp+'/'+pl.max,['Shield '+pl.sh+'/'+pl.maxSh,stx(pl),pl.pow?'Power +'+pl.pow:'',pl.boost?'Boost +'+pl.boost:''].filter(Boolean).join('   ')])}
  floats=floats.filter(f=>now-f.t0<1100);
  for(const f of floats){const o=CH[f.w],[X,Y]=P(o.x+1.5,o.y+1.5),e=(now-f.t0)/1100,yy=Y-1.7*k-72-e*36;
    cx.globalAlpha=1-e*e;cx.font='700 16px Archivo,system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=4;cx.strokeStyle=bg;cx.strokeText(f.t,X+f.o,yy);cx.fillStyle=fg;cx.fillText(f.t,X+f.o,yy);cx.globalAlpha=1}}
function rect(m){if(m.ch){const o=CH[m.ch];return[o.x,o.x+3,o.y,o.y+3]}const[w,h]=dims(m.rot);return[m.x,m.x+w,m.y,m.y+h]}
function depthSort(a){const r=a.map(rect),n=a.length,out=[],vis=[];
  const behind=(i,j)=>r[i][1]<=r[j][0]||r[i][3]<=r[j][2];
  const v=j=>{if(vis[j])return;vis[j]=1;for(let i=0;i<n;i++)if(i!==j&&behind(i,j)&&!behind(j,i))v(i);out.push(a[j])};
  for(let j=0;j<n;j++)v(j);return out}
function newStat(){return{played:0,wasted:0,turn:1,spent:0,pips:0,doubles:0,free:0,maxCost:0,cpu:0,lost:0,battles:0,selfdmg:0,dealt:0,taken:0,absorbed:0,shield:0,healed:0,drawn:0,rerolls:0,t0:performance.now()}}
function rs(){$('#reset').classList.toggle('on',!ended&&!busy&&performance.now()-lastPlay>1e4)}
setInterval(rs,500);
function canPlay(d){if(!condOk(d))return false;const k=d.a+','+d.b;if(!pc.has(k)){let ok=0;for(let r=0;r<4&&!ok;r++){const[w,h]=dims(r);for(let x=0;x<=N-w&&!ok;x++)for(let y=0;y<=N-h&&!ok;y++)ok=check({x,y,rot:r,a:d.a,b:d.b}).ok}pc.set(k,!!ok)}return pc.get(k)}
function cpuPlay(){const rare=Math.random()<.12,own=placed.some(m=>m.cpu);
  for(let n=0;n<500;n++){const m={x:Math.random()*N|0,y:Math.random()*N|0,rot:Math.random()*4|0,cpu:1};clamp(m);
    const cs=cells(m),req=[null,null];let touch=0,bad=0,stem=0;
    cs.forEach(([x,y],k)=>{for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const kk=(x+dx)+','+(y+dy),cc=chr.get(kk);if(cc){if(cc==='c')stem=1;continue}const o=occ.get(kk);if(o){touch=1;if(o.o==='c')stem=1;if(req[k]!==null&&req[k]!==o.pip)bad=1;req[k]=o.pip}}});
    const need=own&&!rare;if(bad||!stem||(need&&!touch)||(rare&&touch))continue;
    m.a=req[0]??(Math.random()*7|0);m.b=req[1]??(Math.random()*7|0);
    if(!check(m,1,'c').ok)continue;
    const id=++uid;cs.forEach(([x,y],k)=>occ.set(x+','+y,{id,o:'c',pip:k?m.b:m.a}));placed.push({...m,born:performance.now()});stat.cpu++;swing={who:'c',t0:performance.now()};return 1}
  return 0}
async function battleWon(){busy=3;stat.battles++;render();
  const gain=[0,1,2].map(()=>newDomino());gain.forEach(d=>collection.push({a:d.a,b:d.b,t:d.t}));
  await showCards('Victory!','You healed to full HP. These 3 dominoes were added to your stack for the next battle.',gain,'Next battle');
  battleNo++;pl=newPl();foe=makeFoe(battleNo);startBattle();render();return stuckCheck()}
async function endTurn(){if(pending||ended||busy)return;busy=1;sel=-1;stat.wasted+=energy;energy=0;render();
  if(!playedTurn){flashScreen();lives--;stat.lost++;render();await sleep(1100);if(lives<=0)return finish('You ran out of lives')}
  foe.sh=0;
  for(const it of foe.intent){await sleep(500);cpuPlay();
    if(it.k==='atk'||it.k==='lifeatk'){const dm=hitPl(Math.max(0,it.v+foe.fury));tick(foe);if(it.k==='lifeatk'&&dm>0){await sleep(250);loseLife()}}
    else if(it.k==='blk'){foe.sh+=it.v;fl('c','+'+it.v+' shield')}
    else if(it.k==='discH'){if(hand.length){deckDisc.push(hand.splice(Math.random()*hand.length|0,1)[0]);fl('p','Domino discarded')}}
    else if(it.k==='mill'){if(deckDraw.length)deckDisc.push(deckDraw.pop());deckDraw.push(garb());fl('p','Garbage on your stack')}
    else if(it.k==='junk'){for(let i=0;i<3;i++)deckDraw.push(garb());shuffle(deckDraw);fl('p','3 Garbage shuffled in')}
    render();if(pl.hp<=0)return finish('You were defeated');if(lives<=0)return finish('You ran out of lives')}
  await sleep(450);stat.turn++;bat.turn++;energy=MAXE;playedTurn=0;if(pl.sh>pl.maxSh){pl.sh=pl.maxSh;fl('p','Excess shield lost')}newIntent();render();
  for(let i=0;i<4;i++){if(drawOne())fresh=hand.length-1;render();await sleep(380)}
  fresh=-1;busy=0;lastPlay=performance.now();
  if(hand.length>=12)return finish('Your hand reached 12 dominoes');render();return stuckCheck()}
/* At the start of a turn (and a battle), if nothing in hand can be played you lose a life and the turn passes. */
async function stuckCheck(){if(ended||busy||pending||hand.some(d=>canPlay(d)))return;busy=1;toast('No playable dominoes: you lose a life');render();await sleep(1300);busy=0;return endTurn()}
function finish(r){reason=r;ended=1;busy=0;$('#otitle').textContent=/^Victory/.test(r)?'Victory':'Game over';render()}
function newGame(){collection=starterCollection();battleNo=1;stat=newStat();lives=3;ended=0;pl=newPl();foe=makeFoe(1);
  $('#otitle').textContent='Game over';$('#pick').classList.remove('on');startBattle();render();stuckCheck()}
function modal(){const s=stat,bp=placed.reduce((t,m)=>t+m.a+m.b,0),hp=hand.reduce((t,d)=>t+d.a+d.b,0),sec=Math.round((performance.now()-s.t0)/1000);
  const rows=[['Result',reason],['Battles won',s.battles],['Turns',s.turn],['Time',Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')],['Lives lost',s.lost],['Your dominoes',s.played],['Computer dominoes',s.cpu],['Damage dealt',s.dealt],['Damage taken',s.taken],['Damage blocked',s.absorbed],['Shield gained',s.shield],['HP healed',s.healed],['Dominoes drawn',s.drawn],['Dominoes rerolled',s.rerolls],['Self damage',s.selfdmg],['Dominoes owned',collection.length],['Pips you played',s.pips],['Pips left in hand',hp],['Pips on board',bp],['Energy spent',s.spent],['Energy wasted',s.wasted],['Energy efficiency',Math.round(100*s.spent/Math.max(1,s.spent+s.wasted))+'%'],['Free plays',s.free],['Doubles played',s.doubles],['Costliest play',s.maxCost],['Board covered',Math.round(placed.length/2)+'%']];
  $('#ostats').innerHTML='<table>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+'</table>'}
function hud(){$('#energy').innerHTML='Energy '+energy+'<br><span style="font-weight:400;font-size:16px">Lives '+'●'.repeat(Math.max(0,lives))+'○'.repeat(Math.max(0,3-lives))+'</span>';
  $('#stats').innerHTML=`Played ${stat.played}<br>Energy wasted ${stat.wasted}<br>Battle ${battleNo}, turn ${bat.turn}<br>Stack ${deckDraw.length} / Discard ${deckDisc.length}`;
  $('#end').disabled=!!pending||!!ended||!!busy;$('#end').classList.toggle('flash',!busy&&!ended&&!pending&&hand.every(d=>!canPlay(d)));rs();pv();$('#over').classList.toggle('on',!!ended);
  if(ended)modal()}
$('#end').onclick=endTurn;
$('#again').onclick=$('#reset').onclick=newGame;

render();stuckCheck();
</script></body></html>
