
name: Build and deploy Godot Web game

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export Godot Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot 4.1.3
        shell: bash
        run: |
          set -euo pipefail

          GODOT_VERSION="4.1.3"
          GODOT_DIR="$RUNNER_TEMP/godot"

          mkdir -p "$GODOT_DIR"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          unzip -q "$RUNNER_TEMP/godot.zip" -d "$GODOT_DIR"

          sudo install -m 0755 \
            "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          cp -a "$RUNNER_TEMP/templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Export Web build
        run: |
          mkdir -p build/web

          godot --headless --path . \
            --export-release "Web" build/web/index.html

          test -s build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
